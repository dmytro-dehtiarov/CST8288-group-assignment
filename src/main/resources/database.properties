# Syntax: ${NAME:default}
# Value order: environment variable NAME, then the NAME entry in .env, then the default after the colon.
# The defaults let the project run on a machine that has no .env file.

db.driver=com.mysql.cj.jdbc.Driver

# Real database
db.url=${DB_URL:jdbc:mysql://localhost:3306/ckc_db}
db.user=${DB_USER:cst8288}
db.password=${DB_PASSWORD:cst8288}

# Test database
test.db.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/ckc_test_db}
test.db.user=${TEST_DB_USER:cst8288}
test.db.password=${TEST_DB_PASSWORD:cst8288}
